[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}]
libs = ["lib"]
out = "out"
solc_version = "0.8.30"
src = "src"
# via_ir is required: it keeps HighwaterHook under the EIP-170 24,576-byte limit
# (20,657 B runtime with the oracle guard; 3,919 B margin).
via_ir = true
optimizer = true
optimizer_runs = 100

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false

# Default verification (fast enough for iteration)
[fuzz]
runs = 1024

[invariant]
runs = 64
depth = 32
fail_on_revert = false
call_override = false

# Heavy campaign: forge test --profile intense
[profile.intense]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
libs = ["lib"]
out = "out"
solc_version = "0.8.30"
src = "src"
via_ir = true
optimizer = true
optimizer_runs = 100

[profile.intense.fuzz]
runs = 2048

[profile.intense.invariant]
runs = 256
depth = 64
fail_on_revert = false

