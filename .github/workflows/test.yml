name: Test Suite

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: default

jobs:
  test:
    name: Foundry Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Test (local suites; fork tests skip without RPC)
        run: forge test -vvv
        id: test

      - name: Evidence suite (offline, committed tape)
        run: python3 backtest/compare.py
        id: evidence
